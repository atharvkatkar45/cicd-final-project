name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 nose
          if [ -f ci-cd-final-project-main/requirements.txt ]; then
            pip install -r ci-cd-final-project-main/requirements.txt
          fi

      - name: Lint with flake8
        run: |
          cd ci-cd-final-project-main
          flake8 service --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests with nose
        run: |
          cd ci-cd-final-project-main
          python -c "import collections, collections.abc, sys; collections.Callable = collections.abc.Callable; import nose; sys.argv = ['nosetests', '-v']; nose.main()"
